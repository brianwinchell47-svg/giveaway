# Copy to personal.yaml (or run `python -m giveaway_bot setup`). Keep it private:
# it's git-ignored and the bot restricts it to owner-only permissions.

# Used only to skip giveaways you can't win (residency / minimum age).
# All optional. Nothing here is ever typed into a website.
profile:
  state: IL                 # two-letter code
  state_name: Illinois
  country: United States
  country_code: US
  birthdate: "1990-04-15"   # YYYY-MM-DD

# Text alerts with giveaway links, sent to your phone. Pick ONE provider and fill its credentials.
# Credentials can instead be set as env vars (TWILIO_AUTH_TOKEN, VOIPMS_API_PASSWORD, ...).
notify:
  provider: twilio          # twilio | voipms | telnyx
  to: "+15555551234"        # your mobile
  from: "+15555550000"      # your Twilio/Telnyx number, or voip.ms DID

  # --- twilio ---
  twilio_account_sid: ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  twilio_auth_token: your-auth-token

  # --- voipms --- (enable API + whitelist your IP at voip.ms > Main Menu > SOAP and REST/JSON API)
  # voipms_username: you@example.com
  # voipms_api_password: your-api-password

  # --- telnyx ---
  # telnyx_api_key: KEYxxxxxxxx
