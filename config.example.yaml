# Copy to config.yaml (git-ignored) and edit.
#
# The bot only READS giveaway pages. It never fills in or submits anything:
# it finds giveaways, checks they're still open and that you're eligible,
# and texts you the links so you can enter them yourself.

# Your state/country/birth date (for eligibility) and SMS credentials live in a
# separate private file. Create it with:  python -m giveaway_bot setup
personal_file: personal.yaml

# Giveaways you want reminders for. frequency: once | daily | weekly
#   daily = you get the link once a day (for daily-entry sweepstakes)
sweepstakes:
  - name: Example daily sweepstakes
    url: https://example.com/sweeps
    frequency: daily
    end_date: "2026-12-31"     # optional; no more reminders after this date

# RSS/Atom feeds from sweepstakes blogs (mostly US giveaways). Each new post is
# checked once; for blog posts the bot finds the sponsor's real entry page and
# sends you that link. Check which feeds work for you:  python -m giveaway_bot feeds
# For a site with no feed, a service like rss.app can make one from a listing page.
feeds:
  - https://www.sweepstakesfanatics.com/feed/
  - https://sweetiessweeps.com/feed/
  - https://ilovegiveaways.com/feed/
  - https://www.sweepstakeslovers.com/feed/
  - https://www.giveawayfrenzy.com/feed/

# Which results to text you: ready (open + eligible), failed (couldn't load),
# skipped (ended / not eligible). Credentials go in personal.yaml.
notify:
  on: [ready]

settings:
  headless: true
  data_dir: data
  delay_between_checks_s: 3
  max_discovered_per_run: 10    # new feed giveaways checked (and texted) per run
  loop_interval_hours: 24
