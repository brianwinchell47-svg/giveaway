# Copy to config.yaml and fill in. config.yaml is git-ignored (it holds your personal info).

# Your personal details and SMS credentials live in a separate private file,
# personal.yaml (git-ignored). Create it with:  python -m giveaway_bot setup
# or copy personal.example.yaml. (A `profile:` section here also works.)
personal_file: personal.yaml

# Giveaways to enter. frequency: once | daily | weekly
sweepstakes:
  - name: Example daily sweepstakes
    url: https://example.com/sweeps
    frequency: daily
    end_date: "2026-12-31"     # optional; skipped after this date
    # Optional overrides when the auto-detection gets a site wrong:
    # fields:
    #   "#promo-code": "WINTER"
    # submit_selector: "button.enter-btn"
    # success_text: ["You're entered"]

# RSS/Atom feeds from sweepstakes blogs (mostly US giveaways). New posts are
# recorded each run; they're entered automatically only when
# settings.auto_enter_discovered is true. The bot follows each post's "enter here"
# link to the real entry page, and never fills a blog's comment or newsletter forms.
# Check which feeds work from your network with:  python -m giveaway_bot feeds
# For a site with no feed, a service like rss.app can make one from a listing page.
feeds:
  - https://www.sweepstakesfanatics.com/feed/
  - https://sweetiessweeps.com/feed/
  - https://ilovegiveaways.com/feed/
  - https://www.sweepstakeslovers.com/feed/
  - https://www.giveawayfrenzy.com/feed/

# Text-message alerts (credentials go in personal.yaml, or env vars). Which
# outcomes trigger a text: needs_manual, failed, entered, submitted_unconfirmed.
notify:
  on: [needs_manual]

settings:
  headless: true
  data_dir: data
  delay_between_entries_s: 20
  accept_rules: true            # tick "I agree to the Official Rules" boxes
  accept_marketing: false       # tick newsletter / partner-offer boxes
  auto_enter_discovered: false
  max_discovered_per_run: 10
  loop_interval_hours: 24
  screenshots: true             # saved to data/screenshots after each submit
